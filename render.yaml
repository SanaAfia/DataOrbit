services:
  - type: web
    name: dataorbit
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
    disk:
      name: dataorbit-pdfs
      mountPath: /opt/render/project/src/.data
      sizeGB: 1
